name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-frontend:
    name: TypeScript check (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  lint-backend:
    name: Lint + type check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff and mypy
        # Versoes fixadas. O ruff 0.16 ampliou o conjunto de regras padrao e passou
        # a acusar 38 erros em livo-ai/backend/main.py, arquivo intocado desde junho.
        # Estas sao as versoes do ultimo CI verde, o run de 2026-07-02.
        run: pip install ruff==0.15.20 mypy==2.1.0

      - name: Ruff lint
        run: ruff check livo-ai/backend/

      - name: Mypy type check
        run: mypy livo-ai/backend/main.py --ignore-missing-imports
